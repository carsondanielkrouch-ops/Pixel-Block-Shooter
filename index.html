<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Block Shooter</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f8fafc; background: #090b16; }
    main { width: min(90vw, 720px); padding: 3rem; text-align: center; border: 4px solid #6ee7ff; box-shadow: 10px 10px 0 #a855f7; background: #11152a; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 4.5rem); line-height: .95; text-transform: uppercase; text-shadow: 4px 4px 0 #a855f7; }
    p { margin: 0; color: #cbd5e1; font-size: 1.1rem; }
    .badge { display: inline-block; margin-top: 2rem; padding: .7rem 1rem; color: #090b16; background: #6ee7ff; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>Pixel Block Shooter</h1>
    <p>The arena is under construction.</p>
    <span class="badge">COMING SOON</span>
  </main>
</body>
</html>
